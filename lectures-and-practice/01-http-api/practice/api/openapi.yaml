openapi: 3.0.3
info:
  title: HTTP API practice
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /items:
    get:
      operationId: listItems
      responses:
        "200":
          description: Static items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
  /items/{id}:
    get:
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Item:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
